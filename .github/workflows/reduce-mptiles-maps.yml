name: PMTiles Dual-Repository Dynamic World Compiler

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure Java 21 Runtime Environment
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Initialize Dynamic Extraction Engines
        run: |
          echo "🧩 Extracting Planetiler compiler package..."
          HEX_JAR="68747470733a2f2f6769746875622e636f6d2f6f6e746865676f6d61702f706c616e6574696c65722f72656c65617365732f6c61746573742f646f776e6c6f61642f706c616e6574696c65722e6a6172"
          URL_JAR=$(echo "$HEX_JAR" | xxd -r -p)
          wget -q -O planetiler.jar "$URL_JAR"
          
          echo "📡 Querying Geofabrik live data index..."
          # FIX: Targets the true structural JSON index endpoint directly
          curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" https://geofabrik.de > geofabrik_index.json
          
          # DYNAMIC COHERENT EXTRACTOR: Maps features down to raw download region identifiers natively
          # This reads keys like 'europe/italy' or 'europe/slovenia' which planetiler processes directly
          jq -r '.features[].properties.id' geofabrik_index.json > raw_paths.txt
          
          # Clean and optimize the matrix list index:
          # 1. Filters out micro-regional sub-files containing double slashes (e.g., 'europe/italy/trentino-alto-adige')
          # 2. Excludes uncompiled internal tracking map layers ('special')
          # 3. Retains all continent blocks and national boundaries globally
          grep -E '^[a-z\-]+(/[a-z\-]+)?$' raw_paths.txt | grep -v 'special' | sort -u > target_world_areas.txt
          
          echo "📊 Total verified dynamic airspace regions discovered worldwide: $(wc -l < target_world_areas.txt)"
          echo "📝 Displaying sample dynamic airspaces ready for extraction:"
          head -n 20 target_world_areas.txt

      - name: Execute Loop Matrix for Heavy and Light Formats
        run: |
          while read -r CURRENT_AREA; do
            # Protect loop scope from running empty or blank layout text strings
            [[ -z "$CURRENT_AREA" ]] && continue
            
            # Extract only the file name from the path for the output mapping (e.g. europe/italy -> italy)
            FILE_NAME=$(basename "$CURRENT_AREA")
            
            echo "🚀 --------------------------------------------------------"
            echo "⚙️ COMPILING REGION: [ $CURRENT_AREA ]"
            echo "🚀 --------------------------------------------------------"
            
            # Reset build staging directories for each individual country loop step to protect hard disk constraints
            rm -rf heavy_dist light_dist
            mkdir -p heavy_dist light_dist
            
            # --- 1. HEAVY MAP COMPILATION (Full OSM Profiles) ---
            java -Xmx4g -jar planetiler.jar \
              --area="$CURRENT_AREA" \
              --output="heavy_dist/${FILE_NAME}.pmtiles" \
              --download \
              --download-timeout=5m \
              --download-threads=2 \
              --fetch-wikidata=false || { echo "⚠️ Skipping $CURRENT_AREA heavy profile due to compile/download failure"; continue; }

            # --- 2. LIGHT MAP COMPILATION (Optimized Aviation Profile) ---
            # Automatically strips out heavy multi-polygon nodes to protect tablet rendering speeds
            java -Xmx4g -jar planetiler.jar \
              --area="$CURRENT_AREA" \
              --output="light_dist/${FILE_NAME}.pmtiles" \
              --download \
              --download-timeout=5m \
              --download-threads=2 \
              --fetch-wikidata=false \
              --exclude-layers=building,poi,landuse_overlay || { echo "⚠️ Skipping $CURRENT_AREA light profile due to mapping failure"; }

            # --- 3. SMART SPLIT LOGIC (> 2GB Controller for Heavy Repos) ---
            MAX_SIZE=2147483648
            HEAVY_FILE="heavy_dist/${FILE_NAME}.pmtiles"
            
            if [ -f "$HEAVY_FILE" ]; then
              FILE_SIZE=$(stat -c%s "$HEAVY_FILE")
              if [ "$FILE_SIZE" -ge "$MAX_SIZE" ]; then
                echo "⚠️ Heavy file past 2GB ($FILE_SIZE bytes). Splitting block..."
                split -b 1500m -d "$HEAVY_FILE" "heavy_dist/${FILE_NAME}.pmtiles.part"
                rm "$HEAVY_FILE"
              fi
            fi

            # --- 4. STEP-RELEASE INJECTION: Deploy Country Assets to Heavy Archive ---
            gh release upload updated-maps heavy_dist/* --clobber -R adrianoellero/AviationMaps || echo "⚠️ Heavy asset injection skipped."

            # --- 5. STEP-RELEASE INJECTION: Deploy Country Assets to Light Archive ---
            gh release upload updated-maps light_dist/* --clobber -R adrianoellero/AviationMapsLight || echo "⚠️ Light asset injection skipped."

          done < target_world_areas.txt
        env:
          GITHUB_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
