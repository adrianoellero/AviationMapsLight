name: PMTiles Dual-Repository Planetiler Matrix Compiler

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    # GLOBAL SECURITY DECLARATION: Forces the environment runner to load the token before step 1
    env:
      GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 🔐 IMMEDIATE 3-SECOND SECURITY GATE
      - name: 🔐 Pre-Flight Token Validation Check
        run: |
          echo "🕵️ Inspecting token availability..."
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ CRITICAL ERROR: The secret 'CROSS_REPO_TOKEN' is completely blank or missing from Repository Secrets!"
            exit 1
          fi
          
          echo "🔑 Testing write access for Heavy Repository (AviationMaps)..."
          gh repo view adrianoellero/AviationMaps --json name || { echo "❌ Access Denied to AviationMaps! Check token scopes."; exit 1; }
          
          echo "🔑 Testing write access for Light Repository (AviationMapsLight)..."
          gh repo view adrianoellero/AviationMapsLight --json name || { echo "❌ Access Denied to AviationMapsLight! Check token scopes."; exit 1; }
          
          echo "✅ SECURITY VALIDATION PASSED! Both repositories are accessible. Starting compilation..."

      - name: Configure Java 21 Runtime Environment
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Initialize Dynamic Extraction Engines
        run: |
          echo "🧩 Extracting Planetiler compiler package..."
          HEX_JAR="68747470733a2f2f6769746875622e636f6d2f6f6e746865676f6d61702f706c616e6574696c65722f72656c65617365732f6c61746573742f646f776e6c6f61642f706c616e6574696c65722e6a6172"
          URL_JAR=$(echo "$HEX_JAR" | xxd -r -p)
          wget -q -O planetiler.jar "$URL_JAR"
          
          echo "📡 Generating clean, verified airspace index..."
          cat << 'EOF' > target_world_areas.txt
          slovenia
          EOF
          
          echo "📊 Total operational master airspace charts seeded: $(wc -l < target_world_areas.txt)"

      - name: Execute Loop Matrix for Heavy and Light Formats
        run: |
          while read -r CURRENT_AREA; do
            [[ -z "$CURRENT_AREA" || "$CURRENT_AREA" =~ ^# ]] && continue
            
            FILE_NAME="$CURRENT_AREA"
            
            echo "🚀 --------------------------------------------------------"
            echo "⚙️ COMPILING REGION: [ $CURRENT_AREA ]"
            echo "🚀 --------------------------------------------------------"
            
            rm -rf heavy_dist light_dist
            mkdir -p heavy_dist light_dist
            
            # --- 1. HEAVY MAP COMPILATION ---
            java -Xmx4g -jar planetiler.jar \
              --area="$CURRENT_AREA" \
              --output="heavy_dist/${FILE_NAME}.pmtiles" \
              --download \
              --download-timeout=5m \
              --download-threads=2 \
              --fetch-wikidata=false || { echo "⚠️ Skipping $CURRENT_AREA heavy profile due to error"; continue; }

            # --- 2. LIGHT MAP COMPILATION ---
            java -Xmx4g -jar planetiler.jar \
              --area="$CURRENT_AREA" \
              --output="light_dist/${FILE_NAME}.pmtiles" \
              --download \
              --download-timeout=5m \
              --download-threads=2 \
              --fetch-wikidata=false \
              --exclude-layers=building,poi,landuse_overlay || { echo "⚠️ Skipping $CURRENT_AREA light profile due to error"; }

            # --- 3. SMART SPLIT LOGIC ---
            MAX_SIZE=2147483648
            HEAVY_FILE="heavy_dist/${FILE_NAME}.pmtiles"
            
            if [ -f "$HEAVY_FILE" ]; then
              FILE_SIZE=$(stat -c%s "$HEAVY_FILE")
              if [ "$FILE_SIZE" -ge "$MAX_SIZE" ]; then
                echo "⚠️ Heavy file past 2GB ($FILE_SIZE bytes). Splitting block..."
                split -b 1500m -d "$HEAVY_FILE" "heavy_dist/${FILE_NAME}.pmtiles.part"
                rm "$HEAVY_FILE"
              fi
            fi

            # --- 4. STEP-RELEASE INJECTION: Deploy Country Assets to Heavy Archive ---
            gh release upload updated-maps heavy_dist/* --clobber -R adrianoellero/AviationMaps || echo "⚠️ Heavy asset injection skipped."

            # --- 5. STEP-RELEASE INJECTION: Deploy Country Assets to Light Archive ---
            gh release upload updated-maps light_dist/* --clobber -R adrianoellero/AviationMapsLight || echo "⚠️ Light asset injection skipped."

          done < target_world_areas.txt
